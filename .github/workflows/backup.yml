name: Backup otomatis ke email

on:
  schedule:
    - cron: '17 13 * * 0'   # Minggu 21:17 WITA → backup mingguan
    - cron: '23 0 1 * *'    # Tanggal 1, 08:23 WITA → laporan bulan lalu + backup lengkap
  workflow_dispatch:
    inputs:
      mode:
        description: 'Jenis backup'
        type: choice
        options: [mingguan, bulanan]
        default: mingguan

permissions:
  contents: read
  actions: write   # untuk menjaga jadwal tetap aktif (lihat langkah terakhir)

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Makassar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Tentukan jenis backup
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "23 0 1 * *" ]; then
            echo "mode=bulanan" >> "$GITHUB_OUTPUT"
          else
            echo "mode=mingguan" >> "$GITHUB_OUTPUT"
          fi

      - name: Cek secrets
        id: cek
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GU: ${{ secrets.GMAIL_USER }}
          GP: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          if [ -z "$SA" ] || [ -z "$GU" ] || [ -z "$GP" ]; then
            echo "::warning::Secrets backup belum lengkap (FIREBASE_SERVICE_ACCOUNT, GMAIL_USER, GMAIL_APP_PASSWORD). Backup dilewati."
            echo "siap=false" >> "$GITHUB_OUTPUT"
          else
            echo "siap=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Backup & kirim email
        if: steps.cek.outputs.siap == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          BACKUP_TO: ${{ secrets.BACKUP_TO }}
        run: npx tsx scripts/backup.ts ${{ steps.mode.outputs.mode }}

      # GitHub menonaktifkan jadwal di repositori publik setelah 60 hari tanpa aktivitas.
      # Langkah ini mengaktifkan ulang jadwal setiap kali berjalan agar backup tidak berhenti diam-diam.
      - name: Jaga jadwal tetap aktif
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/backup.yml/enable" || true
